name: Atualizar Estatísticas do Perfil

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar identidade do Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Gerar Card de Estatísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=LLLucasLL&show_icons=true&include_all_commits=true&theme=tokyonight&locale=pt-br
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar Card de Linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=LLLucasLL&layout=compact&langs_count=8&theme=tokyonight&locale=pt-br
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit e Push das Alterações
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Atualização automática dos cards de estatísticas [skip ci]"
          branch: main
          push_options: '--force'
