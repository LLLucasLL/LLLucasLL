name: Atualizar Estatísticas do Perfil

on:
  schedule:
    - cron: "0 0 * * *" # Executa automaticamente todos os dias à meia-noite
  workflow_dispatch: # Permite que execute manualmente pelo painel do GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessário para o Action poder salvar os svgs gerados no seu repositório
    steps:
      - uses: actions/checkout@v4

      # 1. Gera o card principal de estatísticas
      - name: Gerar Card de Estatísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=lucas-lica&show_icons=true&include_all_commits=true&theme=tokyonight&locale=pt-br
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Gera o card de linguagens mais usadas
      - name: Gerar Card de Linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=lucas-lica&layout=compact&langs_count=8&theme=tokyonight&locale=pt-br
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Faz o commit automático dos arquivos gerados na pasta profile/
      - name: Commit e Push das Alterações
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Atualização automática dos cards de estatísticas [skip ci]"
          branch: main